{ box-sizing: border-box; }

/* TELA DE LOGIN */

.header-right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn-nav { background: var(--iron); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 6px; font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }

.content-box { background: var(--card-gradient); border: 1px solid var(--card-border); border-radius: 12px; padding: 22px; box-shadow: var(--shadow-card); transition: border-color 0.25s; box-sizing: border-box; }

.btn-chart-nav { background: var(--iron); border: 1px solid var(--card-border); color: var(--text-main); padding: 5px 11px; border-radius: 4px; font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.15s; }

.collapsible-body { transition: max-height 0.25s ease, opacity 0.2s ease; max-height: 1400px; opacity: 1; overflow: hidden; }

.collapsible-body.minimized { max-height: 0 !important; opacity: 0 !important; padding: 0 !important; margin: 0 !important; pointer-events: none; }



.chart-view-slide { display: none; width: 100%; height: 380px; position: relative; box-sizing: border-box; }
